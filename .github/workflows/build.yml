name: Build Mod DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout mod source (this fork)
      uses: actions/checkout@v4

    # RE-UE4SS main cannot be cloned publicly anymore: its deps/first/Unreal
    # (UEPseudo) submodule is private. HorseMod vendors a complete,
    # self-contained RE-UE4SS tree with all Unreal pseudo deps as real dirs,
    # and is actively maintained (verified buildable for cpp mods via CMake).
    - name: Checkout HorseMod tree (vendored self-contained RE-UE4SS)
      uses: actions/checkout@v4
      with:
        repository: FottenSC/HorseMod
        path: HorseMod
        fetch-depth: 1

    - name: Set up MSVC environment (cl + Ninja)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Inject ModIntegratedStorageCpp into the build tree
      shell: pwsh
      run: |
        $modDir = "HorseMod/ModIntegratedStorageCpp"
        New-Item -ItemType Directory -Force -Path "$modDir/src" | Out-Null
        Copy-Item -Path "src/dllmain.cpp" -Destination "$modDir/src/dllmain.cpp"
        @'
        set(TARGET ModIntegratedStorageCpp)
        add_library(${TARGET} SHARED src/dllmain.cpp)
        # UE4SS re-exports (PUBLIC) its include dirs, fmt, PolyHook_2, ... so
        # linking UE4SS covers everything dllmain.cpp includes.
        target_link_libraries(${TARGET} PUBLIC UE4SS)
        '@ | Set-Content -Encoding utf8NoBOM "$modDir/CMakeLists.txt"
        Add-Content -Path "HorseMod/CMakeLists.txt" -Value "add_subdirectory(ModIntegratedStorageCpp)"

    - name: Configure (Palworld = UE 5.1 -> Game__Shipping__Win64)
      shell: pwsh
      run: cmake -B build -S HorseMod -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64

    - name: Build mod target
      shell: pwsh
      run: cmake --build build --target ModIntegratedStorageCpp --parallel $env:NUMBER_OF_PROCESSORS

    - name: Collect built DLL
      shell: pwsh
      run: |
        $dll = Get-ChildItem -Path build -Recurse -Filter "ModIntegratedStorageCpp.dll" | Select-Object -First 1
        if (-not $dll) { throw "ModIntegratedStorageCpp.dll not found in build output" }
        Write-Host "Built: $($dll.FullName)"
        Copy-Item $dll.FullName -Destination "ModIntegratedStorageCpp.dll"

    - name: Upload DLL artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModIntegratedStorageCpp-dll
        path: ModIntegratedStorageCpp.dll
        if-no-files-found: error
